[package]
name = "magma_winit"
version = "0.2.0-alpha"
edition = "2024"
description = "Part of the Magma-API, which is the API of the Magma3D game engine. A winit windowing and input backend implementation."
homepage = "https://dynamicgoose.github.io/magma3d-engine/"
license = "MIT"
repository = "https://codeberg.org/DynamicGoose/magma-api"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
magma_app = { path = "../magma_app", version = "0.3.0-alpha" }
magma_windowing = { path = "../magma_windowing", version = "0.2.0-alpha" }
magma_input = { path = "../magma_input", version = "0.2.0-alpha" }
winit = "0.30.13"
glam = "0.33.5"

[features]
default = ["x11", "wayland"]

x11 = ["winit/x11"]
wayland = ["winit/wayland", "winit/wayland-csd-adwaita"]
android = ["winit/android-game-activity", "winit/android-native-activity"]

# These need to be run on the main thread, which normal tests don't do
[[test]]
name = "winit_tests"
path = "tests/main.rs"
harness = false
