[package]
name = "magma_render"
version = "0.1.0-alpha"
edition = "2024"
description = "Partt of the Magma-API. Rendering Capability for the engine."
homepage = "https://dynamicgoose.github.io/magma3d-engine/"
license = "MIT"
repository = "https://codeberg.org/DynamicGoose/magma-api"

[dependencies]
magma_app = { path = "../magma_app", version = "0.3.0-alpha" }
magma_winit = { path = "../magma_winit", version = "0.2.0-alpha" }
magma_windowing = { path = "../magma_windowing", version = "0.2.0-alpha" }
glam = "0.33.5"
wgpu = "30.0.1"
pollster = "1.0.1"

[dev-dependencies]
env_logger = "0.11.8"

# needs to run on main thread bc winit
[[test]]
name = "rendering_tests"
path = "tests/main.rs"
harness = false
